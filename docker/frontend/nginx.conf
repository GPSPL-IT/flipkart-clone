# ============================================================
#  nginx.conf — React SPA serve karta hai + /api proxy
#  📁 Location: docker/frontend/nginx.conf
# ============================================================

server {
    listen 80;
    server_name _;

    # Vite build output yahan hoga
    root  /usr/share/nginx/html;
    index index.html;

    # ── Gzip compression ─────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css text/javascript application/json
                    application/javascript application/x-javascript
                    image/svg+xml;

    # ── Static assets — aggressive caching ───────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires             1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── /api/* — backend container ko forward karo ───────
    # "backend" = Docker service name (Docker DNS resolve karta hai)
    location /api/ {
        proxy_pass          http://backend:5000;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # ── SPA fallback — sabhi routes index.html pe jaate hain ──
    # React Router ke liye zaroori hai
    location / {
        try_files $uri $uri/ /index.html;
    }
}
